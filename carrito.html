<script>
let contador = 0;

// --- Cargar desde localStorage ---
if (localStorage.getItem("carritoCount")) {
    contador = parseInt(localStorage.getItem("carritoCount"));
    document.getElementById("contadorCarrito").textContent = contador;
    document.getElementById("itemsCarrito").textContent = contador;
}

// --- Agregar ---
function agregarAlCarrito() {
    contador++;
    updateCarrito();
}

// --- Quitar ---
function quitarDelCarrito() {
    if (contador > 0) contador--;
    updateCarrito();
}

// --- Vaciar ---
function vaciarCarrito() {
    contador = 0;
    updateCarrito();
}

// --- Actualizar contador global ---
function updateCarrito() {
    document.getElementById("contadorCarrito").textContent = contador;
    document.getElementById("itemsCarrito").textContent = contador;

    // animación
    let c = document.getElementById("contadorCarrito");
    c.classList.remove("bounce");
    void c.offsetWidth; // reset animación
    c.classList.add("bounce");

    // guardar persistente
    localStorage.setItem("carritoCount", contador);
}
</script>
<script>
// ------------------------------
// Cargar carrito desde localStorage
// ------------------------------
function cargarCarrito() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let contenedor = document.getElementById("lista-carrito");
    contenedor.innerHTML = "";

    if(carrito.length === 0){
        contenedor.innerHTML = `<p class="vacio">Tu carrito está vacío 😢</p>`;
        document.getElementById("total-general").innerHTML = "Total: $0";
        return;
    }

    let totalGeneral = 0;

    carrito.forEach((item, index) => {
        let itemTotal = item.precio * item.cantidad;
        totalGeneral += itemTotal;

        contenedor.innerHTML += `
            <div class="producto-carrito" 
                 style="display:flex; justify-content:space-between; 
                        background:#0b1220; padding:15px; 
                        border-radius:10px; margin-bottom:10px;">

                <div>
                    <h3>${item.nombre}</h3>
                    <p>Cantidad: ${item.cantidad}</p>
                </div>

                <div style="display:flex; flex-direction:column; text-align:right;">
                    <span style="font-size:20px;">$${itemTotal}</span>
                    <button onclick="eliminarItem(${index})"
                            style="margin-top:10px; background:#ff6b6b; border:none; 
                                   padding:8px 12px; border-radius:6px; color:white; 
                                   cursor:pointer;">
                        Eliminar
                    </button>
                </div>

            </div>
        `;
    });

    document.getElementById("total-general").innerHTML = "Total: $" + totalGeneral;
}

// ------------------------------
// Eliminar un producto del carrito
// ------------------------------
function eliminarItem(index) {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    carrito.splice(index, 1);
    localStorage.setItem("carrito", JSON.stringify(carrito));
    cargarCarrito();
}

// cargar al abrir
cargarCarrito();
</script>

<script>
function cargarCarrito() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let contenedor = document.getElementById("listaCarrito");
    let total = 0;

    contenedor.innerHTML = "";

    carrito.forEach(item => {
        total += item.precio * item.cantidad;

        contenedor.innerHTML += `
        <div class="item-carrito">
            <img src="${item.imagen}" class="img-carrito">

            <div class="info-carrito">
                <h3>${item.nombre}</h3>
                <p class="precio">Precio: $${item.precio}</p>

                <div class="cantidad-box">
                    <button class="btn-cant" onclick="cambiarCantidad('${item.nombre}', -1)">−</button>
                    <span class="cantidad" id="cant-${item.nombre}">${item.cantidad}</span>
                    <button class="btn-cant" onclick="cambiarCantidad('${item.nombre}', 1)">+</button>
                </div>
            </div>

            <button class="eliminar" onclick="eliminarProducto('${item.nombre}')">✖</button>
        </div>`;
    });

    document.getElementById("totalPagar").textContent = total;
}

function cambiarCantidad(nombre, valor) {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    carrito = carrito.map(item => {
        if (item.nombre === nombre) {
            item.cantidad += valor;
            if (item.cantidad < 1) item.cantidad = 1; // evita 0
        }
        return item;
    });

    localStorage.setItem("carrito", JSON.stringify(carrito));

    cargarCarrito();
    actualizarContador();
}

function eliminarProducto(nombre) {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    carrito = carrito.filter(item => item.nombre !== nombre);

    localStorage.setItem("carrito", JSON.stringify(carrito));

    cargarCarrito();
    actualizarContador();
}

function actualizarContador() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);

    document.getElementById("contadorCarrito").textContent = totalItems;
}

cargarCarrito();
</script>
<script>
// ==========================================
//   SISTEMA DE CARRITO — UNIFICADO Y FUNCIONAL
// ==========================================

// 🔥 Cargar carrito desde localStorage
function cargarCarrito() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let contenedor = document.getElementById("lista-carrito");
    let total = 0;

    contenedor.innerHTML = "";

    if (carrito.length === 0) {
        contenedor.innerHTML = `<p class="vacio">Tu carrito está vacío 😢</p>`;
        document.getElementById("total-general").textContent = "Total: $0";
        return;
    }

    carrito.forEach(item => {
        total += item.precio * item.cantidad;

        contenedor.innerHTML += `
        <div class="item-carrito">
            <img src="${item.imagen}" class="img-carrito">

            <div class="info-carrito">
                <h3>${item.nombre}</h3>
                <p class="precio">Precio: $${item.precio}</p>

                <div class="cantidad-box">
                    <button class="btn-cant" onclick="cambiarCantidad('${item.nombre}', -1)">−</button>
                    <span class="cantidad" id="cant-${item.nombre}">${item.cantidad}</span>
                    <button class="btn-cant" onclick="cambiarCantidad('${item.nombre}', 1)">+</button>
                </div>
            </div>

            <button class="eliminar" onclick="eliminarProducto('${item.nombre}')">✖</button>
        </div>`;
    });

    document.getElementById("total-general").textContent = "Total: $" + total;

    actualizarContador();
}

// ==========================================
//  SUMAR / RESTAR
// ==========================================
function cambiarCantidad(nombre, valor) {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    carrito = carrito.map(item => {
        if (item.nombre === nombre) {
            item.cantidad += valor;
            if (item.cantidad < 1) item.cantidad = 1; 
        }
        return item;
    });

    localStorage.setItem("carrito", JSON.stringify(carrito));
    cargarCarrito();
}

// ==========================================
//  ELIMINAR PRODUCTO
// ==========================================
function eliminarProducto(nombre) {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    carrito = carrito.filter(item => item.nombre !== nombre);

    localStorage.setItem("carrito", JSON.stringify(carrito));
    cargarCarrito();
}

// ==========================================
//   CONTADOR DEL CARRITO (global)
// ==========================================
function actualizarContador() {
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let totalItems = carrito.reduce((sum, item) => sum + item.cantidad, 0);

    document.getElementById("contadorCarrito").textContent = totalItems;
    document.getElementById("itemsCarrito").textContent = totalItems;
}

// ==========================================
//   AGREGAR DESDE STICKERS
// ==========================================
function agregarPack(nombre, precio, imagen) {

    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

    let item = carrito.find(p => p.nombre === nombre);

    if (item) {
        item.cantidad++;
    } else {
        carrito.push({
            nombre: nombre,
            precio: precio,
            imagen: imagen,
            cantidad: 1
        });
    }

    localStorage.setItem("carrito", JSON.stringify(carrito));

    actualizarContador();

    // ir directo al carrito
    location.href = "carrito.html";
}

// cargar al abrir
cargarCarrito();
</script>
