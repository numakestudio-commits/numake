<section class="contacto">
    <h2>Contacto</h2>
    <p>Completá el formulario y nos contactamos con vos.</p>

    <form action="https://formspree.io/f/xzdbqlpz" method="POST">
        <input type="hidden" name="Asunto" value="Consulta">
        <input type="text" name="Nombre" placeholder="Nombre" required>
        <input type="email" name="Email" placeholder="Email" required>
        <input type="text" name="telefono" placeholder="Teléfono (opcional)">
        <input type="hidden" name="Plan" id="hiddenPlan" value="">
        <textarea name="Mensaje" placeholder="Contame brevemente sobre tu proyecto"></textarea>
        <button type="submit">Enviar mensaje</button>
    </form>

    <p class="mail-contacto">
        <em>Si tenés dudas o querés un diseño personalizado, escribinos a:</em><br>
        <a href="mailto:numakestudio@gmail.com"><strong>numakestudio@gmail.com</strong></a>
    </p>
</section>

<script src="numake-menu.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const select = document.getElementById('customPlanSelect');
    const selected = select.querySelector('.selected-option');
    const options = select.querySelectorAll('.option');
    const hiddenInput = document.getElementById('hiddenPlan');

    selected.addEventListener('click', () => select.classList.toggle('open'));

    document.addEventListener('click', (e) => {
        if (!select.contains(e.target)) select.classList.remove('open');
    });

    options.forEach(opt => {
        opt.addEventListener('click', () => {
            options.forEach(o => o.classList.remove('selected'));
            opt.classList.add('selected');
            selected.textContent = opt.textContent;
            hiddenInput.value = opt.dataset.value;
            select.classList.remove('open');
        });
    });
});
</script>
</body>
